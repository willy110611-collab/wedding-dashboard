<!DOCTYPE html>
<html lang="zh-Hant-TW" data-theme="champagne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFF8EE" id="themeColor">
<title>Our Wedding · 2027.10.10</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Our Wedding">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Great+Vibes&family=Noto+Serif+TC:wght@300;500&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   FRAMEWORK STYLES
   Themes (themes/<id>.js) set the public variables on html[data-theme]:
     --bg1..4 --orb1..3 --text --text-soft --accent1 --accent2 --card-bg
     --card-border --card-shadow --card-radius --chip-bg --chip-text
     --danger --font-body --font-display --font-script
   Everything else below is derived from those, and a theme may override
   any of the derived (internal) variables for finer control.
   ===================================================================== */
html{
  /* fallbacks until a theme's css is injected */
  --bg1:#FFF8EE; --bg2:#F9E6D2; --bg3:#F5D0D3; --bg4:#EFE3F3;
  --orb1:rgba(243,221,180,.6); --orb2:rgba(243,191,198,.6); --orb3:rgba(220,210,240,.45);
  --text:#5B4636; --text-soft:#8A7260; --accent1:#D2A868; --accent2:#DE8F9B;
  --card-bg:rgba(255,255,255,.55); --card-border:rgba(226,198,150,.6);
  --card-shadow:0 24px 60px -28px rgba(150,104,74,.42),0 2px 10px -4px rgba(150,104,74,.12); --card-radius:24px;
  --chip-bg:rgba(255,255,255,.7); --chip-text:#8A7260; --danger:#C4747F;
  --font-body:"Noto Serif TC","Songti TC","PMingLiU","Noto Serif CJK TC",serif;
  --font-display:var(--font-body); --font-script:var(--font-display);

  /* derived */
  --ink:var(--text); --ink-2:var(--text-soft); --ink-3:color-mix(in srgb,var(--text-soft) 68%,transparent);
  --accent-ink:color-mix(in srgb,var(--accent1) 62%,var(--text));
  --hair:color-mix(in srgb,var(--accent1) 55%,transparent);
  --hair-2:color-mix(in srgb,var(--accent1) 30%,transparent);
  --hair-b:color-mix(in srgb,var(--accent2) 45%,transparent);
  --mute:color-mix(in srgb,var(--text-soft) 35%,transparent);
  --glow:color-mix(in srgb,var(--accent2) 28%,transparent);
  --page:var(--bg1);
  --bg-grad:linear-gradient(125deg,var(--bg1) 0%,var(--bg2) 17%,var(--bg3) 34%,var(--bg4) 50%,var(--bg2) 66%,var(--bg3) 83%,var(--bg1) 100%);
  --soft-bg:var(--card-bg); --soft-radius:calc(var(--card-radius) * .75);
  --soft-shadow:0 10px 30px -22px color-mix(in srgb,var(--text) 55%,transparent);
  --blur:blur(20px) saturate(1.25);
  --grad-text:linear-gradient(100deg,var(--accent1) 0%,var(--accent2) 50%,var(--accent1) 100%);
  --grad-bar:linear-gradient(90deg,var(--accent1),var(--accent2));
  --grad-deep:linear-gradient(90deg,color-mix(in srgb,var(--accent1) 82%,var(--text)),color-mix(in srgb,var(--accent2) 82%,var(--text)));
  --grad-pale:linear-gradient(90deg,color-mix(in srgb,var(--accent1) 34%,#fff),color-mix(in srgb,var(--accent2) 34%,#fff));
  --d-m:var(--accent1); --d-f:var(--accent2); --d-c:color-mix(in srgb,var(--text-soft) 55%,#fff);
  --g-m:linear-gradient(90deg,color-mix(in srgb,var(--d-m) 55%,#fff),var(--d-m));
  --g-f:linear-gradient(90deg,color-mix(in srgb,var(--d-f) 55%,#fff),var(--d-f));
  --g-c:linear-gradient(90deg,color-mix(in srgb,var(--d-c) 55%,#fff),var(--d-c));
  --track:rgba(255,255,255,.7); --ring-track:color-mix(in srgb,var(--text) 9%,transparent);
  --ring-1:var(--accent1); --ring-2:var(--accent2); --ring-3:color-mix(in srgb,var(--accent2) 80%,var(--text));
  --btn:linear-gradient(100deg,var(--accent1),var(--accent2) 55%,var(--accent1)); --btn-ink:#fff;
  --btn-ts:0 1px 2px color-mix(in srgb,var(--text) 45%,transparent);
  --btn-sh:0 14px 28px -14px color-mix(in srgb,var(--accent2) 90%,transparent);
  --on:linear-gradient(100deg,var(--accent1),var(--accent2)); --on-ink:#fff; --on-ts:var(--btn-ts);
  --field:rgba(255,255,255,.55); --field-f:rgba(255,255,255,.8);
  --c-gold-bg:color-mix(in srgb,var(--accent1) 28%,#fff); --c-gold-ink:color-mix(in srgb,var(--accent1) 45%,var(--text));
  --c-blush-bg:color-mix(in srgb,var(--accent2) 26%,#fff); --c-blush-ink:color-mix(in srgb,var(--accent2) 45%,var(--text));
  --c-rose-bg:var(--danger); --c-rose-ink:#fff;
  --c-mist-bg:color-mix(in srgb,var(--text-soft) 16%,#fff); --c-mist-ink:var(--text-soft);
  --alert-bg:color-mix(in srgb,var(--danger) 12%,#fff); --alert-ink:color-mix(in srgb,var(--danger) 80%,var(--text));
  --booked-item:var(--card-bg);
  --bar-bg:color-mix(in srgb,var(--bg1) 80%,transparent); --tabbar-bg:color-mix(in srgb,var(--bg1) 95%,transparent);
  --sheet-bg:color-mix(in srgb,var(--bg1) 90%,transparent); --scrim:rgba(50,36,26,.32);
  --latin:var(--font-display); --latin-style:normal; --num-w:500; --head-w:500; --body-w:300; --script-w:400; --script-style:italic;
  --tabbar-h:60px; --topbar-h:46px; --orn-h:18px;
  -webkit-text-size-adjust:100%
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:var(--font-body);font-weight:var(--body-w);color:var(--ink);line-height:1.7;
  background:var(--page);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
a{color:inherit}

/* theme crossfade: View Transitions where available, plain colour transitions otherwise */
::view-transition-old(root),::view-transition-new(root){animation-duration:.4s;animation-timing-function:ease}
html.theming *,html.theming *::before,html.theming *::after{transition:background-color .4s ease,color .4s ease,border-color .4s ease,box-shadow .4s ease,fill .4s ease,stroke .4s ease!important}

/* ---------- background ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg2)}
.bg::before{content:"";position:absolute;inset:-100%;will-change:transform;animation:drift 28s ease-in-out infinite;background:var(--bg-grad)}
@keyframes drift{0%,100%{transform:translate3d(24%,10%,0)}50%{transform:translate3d(-24%,-12%,0)}}
.orb{position:absolute;border-radius:50%;will-change:transform}
.orb.a{width:62vmax;height:62vmax;left:-22vmax;top:-20vmax;background:radial-gradient(circle,var(--orb1) 0%,transparent 70%);animation:float1 34s ease-in-out infinite}
.orb.b{width:54vmax;height:54vmax;right:-20vmax;top:18vh;background:radial-gradient(circle,var(--orb2) 0%,transparent 70%);animation:float2 40s ease-in-out infinite}
.orb.c{width:46vmax;height:46vmax;left:8vw;bottom:-22vmax;background:radial-gradient(circle,var(--orb3) 0%,transparent 70%);animation:float3 46s ease-in-out infinite}
.orb.d{width:34vmax;height:34vmax;right:12vw;bottom:-8vmax;background:radial-gradient(circle,var(--orb1) 0%,transparent 70%);opacity:.7;animation:float1 38s ease-in-out infinite reverse}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(9vw,7vh) scale(1.12)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1.05)}50%{transform:translate(-10vw,-8vh) scale(.92)}}
@keyframes float3{0%,100%{transform:translate(0,0)}50%{transform:translate(12vw,-10vh) scale(1.1)}}
#petals{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

/* ---------- shared pieces ---------- */
.card{position:relative;border-radius:var(--card-radius);background:var(--card-bg);border:1px solid var(--card-border);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--card-shadow)}
.card.soft{background:var(--soft-bg);border-radius:var(--soft-radius);box-shadow:var(--soft-shadow);-webkit-backdrop-filter:none;backdrop-filter:none}
.gt{background:var(--grad-text);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;animation:shimmer 9s ease-in-out infinite}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.script{font-family:var(--font-script);font-weight:var(--script-w);font-style:var(--script-style);font-synthesis:none;line-height:1.2}
.latin{font-family:var(--latin);font-style:var(--latin-style);letter-spacing:.04em}
.num{font-family:var(--latin);font-weight:var(--num-w);font-variant-numeric:lining-nums tabular-nums;letter-spacing:.01em}
.chip{display:inline-flex;align-items:center;white-space:nowrap;font-size:11.5px;font-weight:500;line-height:1;padding:5px 10px;border-radius:999px;
  letter-spacing:.06em;color:var(--chip-text);background:var(--chip-bg);box-shadow:inset 0 0 0 1px var(--mute)}
html:root .chip.gold{color:var(--c-gold-ink);background:var(--c-gold-bg)}
html:root .chip.blush{color:var(--c-blush-ink);background:var(--c-blush-bg)}
html:root .chip.rose{color:var(--c-rose-ink);background:var(--c-rose-bg)}
html:root .chip.mist{color:var(--c-mist-ink);background:var(--c-mist-bg)}
.chip.gold,.chip.blush,.chip.rose,.chip.mist{box-shadow:none}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.slot:empty{display:none}
.slot svg{display:block}

/* ---------- lock screen ---------- */
#lock{position:fixed;inset:0;z-index:20;display:flex;padding:24px;padding-top:calc(24px + env(safe-area-inset-top));overflow:auto;
  transition:opacity .8s ease,visibility .8s}
#lock.gone{opacity:0;visibility:hidden;pointer-events:none}
.lock-card{width:100%;max-width:400px;margin:auto;padding:40px 28px 32px;text-align:center;animation:rise 1.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.lock-art{display:flex;justify-content:center;margin:-8px 0 6px}
.lock-art svg{max-width:210px;max-height:120px;width:auto;height:auto}
.lock-title{font-size:clamp(44px,14.5vw,60px);margin:0 0 2px;padding:0 6px}
.lock-date{font-family:var(--latin);font-size:21px;letter-spacing:.34em;margin:14px 0 4px;color:var(--ink);padding-left:.34em}
.lock-venue{font-size:12.5px;letter-spacing:.1em;color:var(--ink-2);margin:0}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;margin:22px auto;color:var(--accent1);max-width:260px;min-height:var(--orn-h)}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--accent1))}
.orn::after{background:linear-gradient(90deg,var(--accent2),transparent)}
.orn .slot{flex:none}
.orn .slot svg{height:var(--orn-h);width:auto;max-width:170px}
.field{position:relative;margin-top:6px}
.field input[type=password]{width:100%;height:52px;padding:0 20px;border:0;outline:0;border-radius:999px;text-align:center;letter-spacing:.3em;
  font-family:var(--latin);font-size:18px;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair),inset 0 2px 8px rgba(120,90,60,.08);
  transition:box-shadow .3s,background .3s}
.field input::placeholder{font-family:var(--font-body);font-size:13.5px;letter-spacing:.3em;color:var(--ink-3)}
.field input[type=password]:focus{background:var(--field-f);box-shadow:inset 0 0 0 1.5px var(--accent2),0 0 0 5px var(--glow)}
.btn-primary{width:100%;height:52px;margin-top:14px;border:0;border-radius:999px;cursor:pointer;font-weight:500;letter-spacing:.5em;padding-left:.5em;color:var(--btn-ink);font-size:15px;
  background:var(--btn);background-size:200% 100%;text-shadow:var(--btn-ts);
  box-shadow:var(--btn-sh);transition:background-position .6s,transform .2s,opacity .3s}
.btn-primary:hover{background-position:100% 0}.btn-primary:active{transform:scale(.985)}.btn-primary:disabled{opacity:.7;cursor:progress}
.remember{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-size:13px;color:var(--ink-2);cursor:pointer;letter-spacing:.1em}
.remember input{appearance:none;-webkit-appearance:none;width:17px;height:17px;border-radius:5px;margin:0;cursor:pointer;background:var(--field-f);
  box-shadow:inset 0 0 0 1px var(--accent1);display:grid;place-items:center}
.remember input:checked{background:var(--on);box-shadow:none}
.remember input:checked::after{content:"";width:9px;height:5px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:translateY(-1px) rotate(-45deg)}
.msg{min-height:22px;margin:14px 0 0;font-size:13px;color:var(--danger);letter-spacing:.08em}
.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}

/* ---------- gear ---------- */
.gear{display:grid;place-items:center;border:0;padding:0;cursor:pointer;background:none;color:var(--ink-2);-webkit-tap-highlight-color:transparent}
.gear svg{width:20px;height:20px;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.gear:active svg{transform:rotate(60deg)}
.gear.fab{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;width:42px;height:42px;border-radius:50%;z-index:21;
  background:var(--bar-bg);box-shadow:inset 0 0 0 1px var(--hair),0 8px 20px -12px color-mix(in srgb,var(--text) 60%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}

/* ---------- app shell: top bar, tab bar, pages ---------- */
#app{position:relative;z-index:2;max-width:1080px;margin:0 auto;
  padding:calc(var(--topbar-h) + env(safe-area-inset-top)) 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 96px)}
.topbar{position:fixed;left:0;right:0;top:0;z-index:12;height:calc(var(--topbar-h) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;justify-content:center;background:var(--bar-bg);
  -webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);border-bottom:1px solid var(--hair-2)}
.topbar-title{font-size:15px;font-weight:500;letter-spacing:.4em;padding-left:.4em;color:var(--ink)}
.topbar .gear{position:absolute;right:6px;bottom:1px;width:44px;height:44px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:12;display:grid;grid-template-columns:repeat(5,1fr);
  height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));padding:0 6px env(safe-area-inset-bottom);
  background:var(--tabbar-bg);-webkit-backdrop-filter:blur(20px) saturate(1.25);backdrop-filter:blur(20px) saturate(1.25);
  border-top:1px solid var(--hair-2);box-shadow:0 -10px 30px -22px color-mix(in srgb,var(--text) 60%,transparent)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-decoration:none;
  color:var(--ink-2);font-size:11px;font-weight:500;letter-spacing:.16em;-webkit-tap-highlight-color:transparent;transition:color .3s}
.tab svg{width:24px;height:24px;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.tab span{padding-left:.16em}
.tab::before{content:"";position:absolute;top:0;left:50%;width:26px;height:3px;margin-left:-13px;border-radius:0 0 4px 4px;background:var(--grad-bar);opacity:0;transform:scaleX(.3);transition:opacity .3s,transform .3s}
.tab.active{color:var(--accent-ink)}
.tab.active::before{opacity:1;transform:none}
.tab.active svg{transform:translateY(-1px) scale(1.08)}
#mascot-layer{position:fixed;left:0;right:0;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom));height:90px;z-index:11;pointer-events:none;overflow:visible}
/* soft "ground" so page text fades out under a walking mascot instead of colliding with it */
#mascot-layer.ground::before{content:"";position:absolute;left:0;right:0;bottom:0;height:104px;pointer-events:none;
  background:linear-gradient(to top,color-mix(in srgb,var(--bg2) 94%,transparent) 0%,color-mix(in srgb,var(--bg2) 80%,transparent) 45%,transparent 100%)}
.page{padding-top:8px}
.page.page-in{animation:pageIn .38s cubic-bezier(.2,.7,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.head{text-align:center;margin:18px 0 22px;position:relative}
.page-subtitle{display:block;font-size:17px;color:var(--accent-ink);opacity:.9}
.page-title{display:inline-flex;align-items:center;margin:0;font-family:var(--font-display);font-size:29px;font-weight:var(--head-w);letter-spacing:.3em;padding-left:.3em}
.heading-icon{flex:none;margin-right:.32em;margin-left:-.3em}
.heading-icon svg{height:1.05em;width:auto}
.head .orn{margin:8px auto 0;max-width:220px}
.sub{font-size:15px;font-weight:500;letter-spacing:.22em;margin:30px 4px 12px;display:flex;align-items:center;gap:10px;color:var(--ink)}
.sub::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--hair),var(--hair-b),transparent)}
.sub small{font-family:var(--latin);font-style:var(--latin-style);font-weight:400;font-size:15px;color:var(--ink-3);letter-spacing:.04em}
.panel{padding:20px 18px}
.grid{display:grid;gap:10px}
.muted{color:var(--ink-2)}.tiny{font-size:12px;color:var(--ink-2);letter-spacing:.06em}

/* overview */
#page-overview{text-align:center;padding-top:22px}
.hero-title{font-size:clamp(46px,15vw,64px);margin:0}
.hero-line{font-size:13px;letter-spacing:.14em;color:var(--ink-2);margin:10px 0 0}
.hero-line b{display:block;font-family:var(--latin);font-weight:500;font-size:19px;letter-spacing:.3em;padding-left:.3em;color:var(--ink);margin-bottom:2px}
.hero-line i{display:none;font-style:normal}
.countdown-card{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:460px;margin:26px auto 0;padding:20px 12px 16px}
.countdown-card.has-corner{margin-top:58px}
.countdown-card>div{position:relative}
.countdown-card>div+div::before{content:"";position:absolute;left:-4px;top:16%;height:68%;width:1px;background:linear-gradient(180deg,transparent,var(--hair),transparent)}
.countdown-card .num{display:block;font-size:46px;line-height:1.05}
.countdown-card>div>span:last-child{font-size:12px;letter-spacing:.4em;padding-left:.4em;color:var(--ink-2)}
.corner-slot{position:absolute;right:14px;bottom:calc(100% - 5px);pointer-events:none;line-height:0}
.corner-slot svg{height:52px;width:auto}
.count-cap{font-size:16px;margin:12px 0 0;color:var(--accent-ink)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.stat-tile{padding:16px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-decoration:none;color:inherit;
  -webkit-tap-highlight-color:transparent;transition:transform .2s}
.stat-tile:active{transform:scale(.97)}
.stat-tile .lab{font-size:12.5px;font-weight:500;letter-spacing:.14em}
.stat-tile .val{font-size:12px;color:var(--ink-2);line-height:1.4}
.stat-tile .val .num{font-size:16px;color:var(--ink)}
.stat-tile .go{font-size:11px;letter-spacing:.14em;color:var(--accent-ink);opacity:.85;margin-top:auto;padding-top:2px}
.ring{position:relative;width:78px;height:78px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:23px}
.ring .num small{font-size:.55em;margin-left:1px}
.ring circle.tr{stroke:var(--ring-track)}
.ring circle.fg{transition:stroke-dashoffset 1.6s cubic-bezier(.2,.7,.2,1)}
.bignum{height:78px;display:grid;place-items:center;font-size:52px;line-height:1}
.foot{text-align:center;padding:34px 0 0}
.foot .script{font-size:34px;margin:0 0 4px}
.foot p{margin:2px 0;font-size:14px;color:var(--ink-2)}

/* bars */
.progress-bar{height:9px;border-radius:999px;background:var(--track);box-shadow:inset 0 0 0 1px var(--hair-2);overflow:hidden;position:relative}
.progress-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--grad-bar);width:0;transition:width 1.4s cubic-bezier(.2,.7,.2,1)}
.progress-bar i.deep,.legend i.deep{background:var(--grad-deep)}
.progress-bar i.pale,.legend i.pale{background:var(--grad-pale)}
.progress-bar i.m{background:var(--g-m)}.progress-bar i.f{background:var(--g-f)}.progress-bar i.c{background:var(--g-c)}
.brow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;padding:9px 0}
.brow .progress-bar{grid-column:1/-1;margin-top:4px}
.brow .t{font-size:14px;font-weight:500;letter-spacing:.06em;min-width:0}
.brow .t small{font-weight:var(--body-w);color:var(--ink-2);margin-left:6px;font-size:12px}
.brow .v{font-size:15px;color:var(--ink-2);white-space:nowrap}
.brow .v .num{font-size:17px;color:var(--ink)}

/* cards / items */
.item{padding:13px 15px}
.item summary{list-style:none;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:0}
.item summary::-webkit-details-marker{display:none}
.item .top{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.item .name{font-weight:500;font-size:15px;letter-spacing:.04em;min-width:0;overflow-wrap:anywhere}
.item .chips{display:flex;gap:5px;flex:none;flex-wrap:wrap;justify-content:flex-end;max-width:58%}
.item .meta{display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:5px;font-size:12.5px;color:var(--ink-2);align-items:baseline}
.item .meta .num{font-size:15px}
.item .more{margin-left:auto;font-size:12px;color:var(--accent-ink);letter-spacing:.1em;display:inline-flex;align-items:center;gap:4px}
.item .more::after{content:"";width:6px;height:6px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .3s}
details[open] .more::after{transform:translateY(1px) rotate(-135deg)}
.item .body{margin-top:10px;padding-top:10px;border-top:1px solid var(--hair-2);font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);line-height:1.75}
details[open] .body{animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.item.dim{opacity:.5}
.item.dim .name{text-decoration:line-through;text-decoration-color:var(--mute)}
.item a.link{font-size:12.5px;color:var(--accent-ink);text-decoration:none;border-bottom:1px solid var(--hair);letter-spacing:.06em}
.done .name{display:flex;align-items:center;gap:8px}
.done .name::before{content:"✦";font-size:11px;color:var(--accent1)}
.done .body{border-top:0;padding-top:0;margin-top:6px;color:var(--ink-2)}
.stage-tag{font-size:12.5px;letter-spacing:.2em;color:var(--accent-ink);margin:16px 4px 2px;font-weight:500}

/* budget */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum .soft{padding:14px 12px 12px;min-width:0}
.sum .lab{font-size:12.5px;letter-spacing:.2em;color:var(--ink-2)}
.sum .num{display:block;font-size:clamp(19px,6vw,26px);line-height:1.25;white-space:nowrap}
.sum .num small{font-size:.5em;letter-spacing:.08em;margin-right:3px;font-style:var(--latin-style);-webkit-text-fill-color:var(--ink-3)}
.neg .num{color:var(--danger)}
.alert{margin-top:12px;padding:11px 15px;font-size:13.5px;border-radius:16px;color:var(--alert-ink);background:var(--alert-bg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--danger) 40%,transparent)}
.alert .num{font-size:17px}
.meter{margin-top:16px}
.meter .progress-bar{height:14px;overflow:visible}
.meter .mark{position:absolute;top:-5px;bottom:-5px;width:1.5px;background:var(--ink);opacity:.55}
.meter .mark::after{content:attr(data-l);position:absolute;top:-19px;right:-1px;font-size:11px;white-space:nowrap;letter-spacing:.08em;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:18px;height:7px;border-radius:9px;margin-right:6px;vertical-align:1px}

/* vendors */
.booked{padding:18px}
.booked .lab{font-size:19px;color:var(--accent-ink)}
.booked .grid{margin-top:10px}
.booked .item{background:var(--booked-item)}

/* guests */
.g5{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.g5 .soft{padding:12px 4px 10px;text-align:center;grid-column:span 2}
.g5 .soft:nth-child(-n+2){grid-column:span 3}
.g5 .num{display:block;font-size:34px;line-height:1.1}
.g5 .lab{font-size:12px;letter-spacing:.14em;color:var(--ink-2)}
.split{display:flex;height:16px;border-radius:999px;overflow:hidden;gap:2px;margin-top:6px}
.split i{display:block;height:100%;min-width:3px;transition:flex-grow 1.4s}
.split i.m{background:var(--g-m)}.split i.f{background:var(--g-f)}.split i.c{background:var(--g-c)}
.split-l{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;margin-top:10px;font-size:13px}
.split-l span{display:flex;align-items:baseline;gap:6px;white-space:nowrap}.split-l .num{font-size:21px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;align-self:center}
.dot.m{background:var(--d-m)}.dot.f{background:var(--d-f)}.dot.c{background:var(--d-c)}
.search{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.search-input{height:46px;width:100%;border:0;outline:0;border-radius:999px;padding:0 20px;font-size:15px;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair)}
.search-input:focus{box-shadow:inset 0 0 0 1.5px var(--accent2),0 0 0 5px var(--glow)}
.search-input::placeholder{color:var(--ink-3);letter-spacing:.1em}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchips button{border:0;cursor:pointer;font-size:13px;letter-spacing:.14em;padding:7px 15px;border-radius:999px;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair);color:var(--ink-2)}
.fchips button.on{color:var(--on-ink);background:var(--on);box-shadow:none;font-weight:500;text-shadow:var(--on-ts)}
.glist{display:grid;gap:0 26px}
.grow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--hair-2)}
.grow .n{font-weight:500;font-size:15px;letter-spacing:.08em}
.grow .g{display:block;font-size:12px;font-weight:var(--body-w);color:var(--ink-2);letter-spacing:.04em}
.grow .cnt{font-size:13px;color:var(--ink-2);white-space:nowrap}.grow .cnt .num{font-size:18px;color:var(--ink)}
.morebtn{display:block;margin:16px auto 2px;border:0;background:none;cursor:pointer;font-size:13px;letter-spacing:.2em;color:var(--accent-ink);border-bottom:1px solid var(--hair);padding:2px 2px 3px}
.empty{text-align:center;padding:22px 0 8px;color:var(--ink-3);font-size:13.5px;letter-spacing:.14em}
.empty .heading-icon{display:flex;justify-content:center;margin:0 0 8px}
.empty .heading-icon svg{height:38px}

/* ---------- settings sheet ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;transition:opacity .32s ease}
.scrim.open{opacity:1}
.settings-sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;
  padding:8px 16px calc(18px + env(safe-area-inset-bottom));border-radius:26px 26px 0 0;color:var(--ink);
  background:var(--sheet-bg);-webkit-backdrop-filter:blur(24px) saturate(1.3);backdrop-filter:blur(24px) saturate(1.3);
  box-shadow:0 -18px 50px -20px rgba(60,40,26,.45),inset 0 1px 0 rgba(255,255,255,.7);
  transform:translateY(104%);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.settings-sheet.open{transform:none}
.settings-sheet .grab{width:38px;height:4px;border-radius:9px;background:var(--mute);margin:0 auto 6px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 10px}
.sheet-h h2{margin:0;font-size:18px;font-weight:500;letter-spacing:.24em}
.sheet-h button{width:36px;height:36px;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--ink-2);background:var(--field-f);box-shadow:inset 0 0 0 1px var(--mute)}
.sheet-h button svg{width:14px;height:14px}
.swatches{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{position:relative;display:block;text-align:left;border:0;cursor:pointer;padding:7px 7px 9px;border-radius:18px;background:var(--field-f);
  box-shadow:inset 0 0 0 1px var(--mute);-webkit-tap-highlight-color:transparent;transition:transform .2s,box-shadow .3s}
.sw:active{transform:scale(.98)}
.sw[aria-checked="true"]{box-shadow:inset 0 0 0 2.5px var(--accent-ink)}
.sw-pv{display:block;border-radius:12px;overflow:hidden;line-height:0;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.sw-pv svg{display:block;width:100%;height:auto}
.sw-n{display:block;margin:7px 3px 0;font-size:14px;font-weight:500;letter-spacing:.08em;line-height:1.35}
.sw-d{display:block;margin:1px 3px 0;font-size:11.5px;color:var(--ink-2);letter-spacing:.04em;line-height:1.4}
.sw-ok{position:absolute;right:12px;top:12px;width:22px;height:22px;border-radius:50%;display:none;place-items:center;background:var(--accent-ink);color:#fff;box-shadow:0 0 0 2px #fff}
.sw-ok svg{width:12px;height:12px}
.sw[aria-checked="true"] .sw-ok{display:grid}
.sheet-f{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;min-height:20px}
.sheet-f span{font-size:11.5px;color:var(--ink-3);letter-spacing:.06em}
.sheet-f button{flex:none;border:0;cursor:pointer;font-size:13px;letter-spacing:.2em;padding:8px 18px;border-radius:999px;color:var(--ink-2);background:var(--field-f);box-shadow:inset 0 0 0 1px var(--mute)}

@media (max-width:359px){.countdown-card .num{font-size:38px}.lock-title{font-size:50px}.tab{letter-spacing:.08em}}
@media (min-width:760px){

  .hero-line{font-size:15px;letter-spacing:.24em}.hero-line b{display:inline;font-size:20px;letter-spacing:.16em;padding:0}.hero-line i{display:inline}
  .countdown-card{max-width:560px;padding:28px 20px 22px}.countdown-card .num{font-size:68px}
  .tiles{gap:18px;max-width:820px;margin:30px auto 0}.stat-tile{padding:26px 10px 18px;gap:9px}
  .ring,.bignum{width:108px;height:108px}.ring .num{font-size:31px}.bignum{font-size:74px;width:auto}
  .stat-tile .lab{font-size:14.5px}.stat-tile .val{font-size:13.5px}.stat-tile .val .num{font-size:19px}
  .head{margin:26px 0 28px}.page-title{font-size:36px}.page-subtitle{font-size:20px}
  .panel{padding:28px 30px}
  .cols2{grid-template-columns:1fr 1fr;align-items:start;gap:12px}
  .cols3{grid-template-columns:repeat(3,1fr);align-items:start;gap:12px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  .sum{grid-template-columns:repeat(4,1fr)}.sum .num{font-size:32px}
  .g5{grid-template-columns:repeat(5,1fr);gap:12px}.g5 .soft,.g5 .soft:nth-child(-n+2){grid-column:auto;padding:18px 6px 14px}.g5 .num{font-size:44px}
  .glist{grid-template-columns:repeat(3,1fr)}
  .search{flex-direction:row;align-items:center}.search-input{max-width:320px}
  .stagegrid{grid-template-columns:1fr 1fr;gap:0 40px}
  .settings-sheet{bottom:24px;border-radius:26px;padding-bottom:18px}
}

@media (min-width:900px){
  html{--tabbar-h:0px;--topbar-h:74px}
  #app{padding-left:28px;padding-right:28px;padding-bottom:130px}
  .topbar{background:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;pointer-events:none}
  .topbar-title{display:none}
  .topbar .gear{pointer-events:auto;right:22px;bottom:auto;top:14px;border-radius:50%;background:var(--bar-bg);box-shadow:inset 0 0 0 1px var(--hair-2);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
  .tabbar{top:12px;bottom:auto;left:50%;right:auto;transform:translateX(-50%);height:auto;width:auto;display:flex;gap:2px;padding:5px;border-radius:999px;
    border:1px solid var(--hair-2);box-shadow:var(--card-shadow)}
  .tab{flex-direction:row;gap:7px;font-size:15px;padding:9px 20px;border-radius:999px}
  .tab svg{width:19px;height:19px}
  .tab::before{display:none}
  .tab.active{color:var(--on-ink);background:var(--on);text-shadow:var(--on-ts)}
  .tab.active svg{transform:none}
}

  /* ---------- art-deco line art ---------- */
  function f(n) { return (Math.round(n * 10) / 10).toString(); }
  function dia(x, y, rx, ry) { return 'M' + f(x) + ' ' + f(y - ry) + 'l' + f(rx) + ' ' + f(ry) + '-' + f(rx) + ' ' + f(ry) + '-' + f(rx) + '-' + f(ry) + 'z'; }
  function star(x, y, s) {

    return 'M' + f(x) + ' ' + f(y - s) + 'c' + f(k * 0.5) + ' ' + f(s - k) + ' ' + f(k) + ' ' + f(s - k * 0.5) + ' ' + f(s) + ' ' + f(s) +
      'c-' + f(s - k) + ' ' + f(k * 0.5) + '-' + f(s - k * 0.5) + ' ' + f(k) + '-' + f(s) + ' ' + f(s) +
      'c-' + f(k * 0.5) + '-' + f(s - k) + '-' + f(k) + '-' + f(s - k * 0.5) + '-' + f(s) + '-' + f(s) +
      'c' + f(s - k) + '-' + f(k * 0.5) + ' ' + f(s - k * 0.5) + '-' + f(k) + ' ' + f(s) + '-' + f(s) + 'z';
  }
  function fan(cx, cy, r0, lens, a0, a1) {
    var d = '', n = lens.length;
    for (var i = 0; i < n; i++) {
      var a = a0 + (a1 - a0) * i / (n - 1), c = Math.cos(a), s = Math.sin(a);
      d += 'M' + f(cx + r0 * c) + ' ' + f(cy + r0 * s) + 'L' + f(cx + lens[i] * c) + ' ' + f(cy + lens[i] * s);
    }
    return d;

  function foilDef(id, x1, y1, x2, y2, dark) {
    var st = dark
      ? ['#5E4315', '#B08A3C', '#76561C', '#D9B761', '#6E5120', '#A8822F', '#5E4315']
      : ['#8A6A2F', '#DDBB66', '#9C7A35', '#F3DE9A', '#A8822F', '#D4AF5A', '#8A6A2F'];

    for (var i = 0; i < st.length; i++) s += '<stop offset="' + f(i / (st.length - 1)) + '" stop-color="' + st[i] + '"/>';

  var HOP_T = 0.6;        // seconds per hop

      }

    function endAct(c) {
      if (c.savedDir) { face(c, c.savedDir); c.savedDir = 0; }

        // the one behind becomes the leader and heads back the other way
        var o = chars[1 - lead];
        var nd = -c.dir;
        lead = 1 - lead;
        if (o.state === 'hop') o.turnTo = nd;

        face(c, nd);
        setState(c, 'idle');
        c.t = 0;
      }

    function update(dt) {

      var L = chars[lead];

            if (c.x < minX) c.x = minX;

            c.phase = 0;
            c.el.style.setProperty('--qk-p', '0');

            c.phase = p;
            c.el.style.setProperty('--qk-p', p.toFixed(3));

      }

      var dt = (now - last) / 1000;

      if (dt > 0.05) dt = 0.05;
      if (dt > 0) update(dt);
      raf = win.requestAnimationFrame(frame);
    }
    function onResize() {
      var w = layer.clientWidth || win.innerWidth || 390;

    setState(chars[1], 'hop');

/* ---------- crypto ---------- */
function b64(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
function decrypt(pass){
  var subtle=window.crypto&&window.crypto.subtle;
  if(!subtle)return Promise.reject(new Error("nocrypto"));
  return subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]).then(function(base){
    return subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.salt),iterations:ENC.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  }).then(function(key){
    return subtle.decrypt({name:"AES-GCM",iv:b64(ENC.iv)},key,b64(ENC.ct));
  }).then(function(buf){return JSON.parse(new TextDecoder().decode(buf))});
}

/* ---------- lock screen ---------- */
var form=$("lockForm"),pw=$("pw"),msg=$("msg"),go=$("go"),busy=false;
function unlock(pass,auto){
  if(busy)return;busy=true;go.disabled=true;go.textContent="開啟中";msg.textContent="";
  decrypt(pass).then(function(data){
    if(auto||$("remember").checked)store.set(pass);else store.del();
    pw.value="";

    fillSlots(document);

    if(err&&err.name!=="OperationError"&&window.console)console.error(err);

      var h=el("h3","sub reveal",g[0]+" ");h.appendChild(el("small",null,g[1].length+""));$("vgroups").appendChild(h);
      var gr=el("div","grid cols3");
      g[1].slice().sort(function(a,b){return isOut(a)-isOut(b)}).forEach(function(v){gr.appendChild(vCard(v,false))});
      $("vgroups").appendChild(gr);
    });

  /* guests */
  function side(g){var s=String(g[1]||"");return s.indexOf("男方")===0?"男方":s.indexOf("女方")===0?"女方":"共同"}
  var sideCls={"男方":"m","女方":"f","共同":"c"};
  var cnt=function(g){return g[3]},yes=G.filter(function(g){return g[2]==="確定出席"}),no=G.filter(function(g){return g[2]==="不克出席"}),
      wait=G.filter(function(g){return g[2]!=="確定出席"&&g[2]!=="不克出席"});
  [["邀請總人數",invited],["確定出席",sum(yes,cnt)],["未回覆",sum(wait,cnt)],["不克出席",sum(no,cnt)],["素食",sum(going,function(g){return g[4]})]].forEach(function(x,i){
    var c=el("div","card soft");c.appendChild(el("span","num"+(i<2?" gt":""),x[1]));c.appendChild(el("div","lab",x[0]));$("gtot").appendChild(c);
  });
  var sides=["男方","女方","共同"].map(function(s){return{n:s,v:sum(going.filter(function(g){return side(g)===s}),cnt)}});
  var sp=el("div","split"),sl=el("div","split-l");
  sides.forEach(function(s){
    if(s.v>0){var i=el("i",sideCls[s.n]);i.style.flex=s.v+" 1 0";i.title=s.n+" "+s.v;sp.appendChild(i)}
    var l=el("span");add(l,el("i","dot "+sideCls[s.n]),s.n,el("span","num",s.v),el("span","tiny",invited?Math.round(s.v/invited*100)+"%":"0%"));sl.appendChild(l);
  });
  add($("gsplit"),sp,sl);
  var note=el("p","tiny","以邀請人數計，不含不克出席");note.style.margin="12px 0 0";$("gsplit").appendChild(note);
  var groups=groupBy(going,function(g){return g[1]||"未分組"}).map(function(x){return{n:x[0],v:sum(x[1],cnt),s:side(x[1][0])}}).sort(function(a,b){return b.v-a.v}),
      gmax=Math.max.apply(null,groups.map(function(g){return g.v}).concat([1]));
  groups.forEach(function(g){
    var r=el("div","brow"),v=el("div","v");add(v,el("span","num",g.v)," 人");
    add(r,el("div","t",g.n),v,bar(pct(g.v,gmax),sideCls[g.s]));$("ggroups").appendChild(r);
  });
  /* guest list */
  var gKind={"確定出席":"gold","不克出席":"rose"},LIMIT=24,state={q:"",side:"全部",all:false};
  var rows=G.map(function(g){
    var r=el("div","grow"),n=el("div","n",g[0]);n.appendChild(el("span","g",g[1]||""));
    var c=el("div","cnt");add(c,el("span","num",g[3])," 位"+(g[4]>0?"・素 "+g[4]:""));
    var st=g[2]==="確定出席"||g[2]==="不克出席"?g[2]:"未回覆";
    add(r,n,c,chip(st,gKind[st]||""));
    return{el:r,name:String(g[0]||"").toLowerCase(),side:side(g)};
  });
  var list=$("glist");rows.forEach(function(r){list.appendChild(r.el)});
  function apply(){
    var q=state.q.trim().toLowerCase(),shown=0,match=0,cap=!state.all&&!q;
    rows.forEach(function(r){
      var ok=(state.side==="全部"||r.side===state.side)&&(!q||r.name.indexOf(q)>=0);
      if(ok)match++;
      var vis=ok&&(!cap||shown<LIMIT);if(vis)shown++;
      r.el.hidden=!vis;
    });
    $("gempty").hidden=match>0;
    $("glistN").textContent=match+" / "+rows.length;
    var more=$("gmore");more.hidden=!(cap&&match>shown);more.textContent="顯示全部 "+match+" 位";
  }
  ["全部","男方","女方","共同"].forEach(function(s){
    if(s==="共同"&&!rows.some(function(r){return r.side==="共同"}))return;
    var b=el("button",s===state.side?"on":"",s);b.type="button";b.setAttribute("aria-pressed",s===state.side);
    b.addEventListener("click",function(){
      state.side=s;[].forEach.call($("gchips").children,function(x){var on=x===b;x.className=on?"on":"";x.setAttribute("aria-pressed",on)});apply();
    });
    $("gchips").appendChild(b);
  });
  $("gq").addEventListener("input",function(e){state.q=e.target.value;apply()});
  $("gmore").addEventListener("click",function(){state.all=true;apply()});
  apply();
}

/* ---------- countdown ---------- */
function startCountdown(iso){
  var target=new Date(iso).getTime();if(isNaN(target))return;
  var p=function(n){return(n<10?"0":"")+n};
  function tick(){
    var s=Math.floor((target-Date.now())/1000);
    if(s<=0){s=0;$("countCap").textContent="today, and every day after";}
    $("cd").textContent=Math.floor(s/86400);$("ch").textContent=p(Math.floor(s%86400/3600));
    $("cm").textContent=p(Math.floor(s%3600/60));$("cs").textContent=p(s%60);
  }
  tick();setInterval(tick,1000);
}

/* ---------- reveal on first view (per page) ---------- */
function fill(root){
  [].forEach.call(root.querySelectorAll("[data-w]"),function(i){i.style.width=i.dataset.w+"%"});
  [].forEach.call(root.querySelectorAll("[data-off]"),function(c){c.style.strokeDashoffset=c.dataset.off});
}
function startReveal(){
  var items=document.querySelectorAll("#app .reveal");
  if(reduce||!("IntersectionObserver" in window)){[].forEach.call(items,function(e){e.classList.add("in")});fill(document);return}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){
    if(e.isIntersecting){e.target.classList.add("in");var t=e.target;setTimeout(function(){fill(t)},150);io.unobserve(t)}
  })},{rootMargin:"0px 0px -4% 0px",threshold:.05});
  [].forEach.call(items,function(e){io.observe(e)});
  fill($("meter"));
}
})();
</script>
