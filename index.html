<!DOCTYPE html>
<html lang="zh-Hant-TW" data-theme="champagne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFF8EE" id="themeColor">
<title>Our Wedding · 2027.10.10</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Our Wedding">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Great+Vibes&family=Noto+Serif+TC:wght@300;500&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   FRAMEWORK STYLES
   Themes (themes/<id>.js) set the public variables on html[data-theme]:
     --bg1..4 --orb1..3 --text --text-soft --accent1 --accent2 --card-bg
     --card-border --card-shadow --card-radius --chip-bg --chip-text
     --danger --font-body --font-display --font-script
   Everything else below is derived from those, and a theme may override
   any of the derived (internal) variables for finer control.
   ===================================================================== */
html{
  /* fallbacks until a theme's css is injected */
  --bg1:#FFF8EE; --bg2:#F9E6D2; --bg3:#F5D0D3; --bg4:#EFE3F3;
  --orb1:rgba(243,221,180,.6); --orb2:rgba(243,191,198,.6); --orb3:rgba(220,210,240,.45);
  --text:#5B4636; --text-soft:#8A7260; --accent1:#D2A868; --accent2:#DE8F9B;
  --card-bg:rgba(255,255,255,.55); --card-border:rgba(226,198,150,.6);
  --card-shadow:0 24px 60px -28px rgba(150,104,74,.42),0 2px 10px -4px rgba(150,104,74,.12); --card-radius:24px;
  --chip-bg:rgba(255,255,255,.7); --chip-text:#8A7260; --danger:#C4747F;
  --font-body:"Noto Serif TC","Songti TC","PMingLiU","Noto Serif CJK TC",serif;
  --font-display:var(--font-body); --font-script:var(--font-display);

  /* derived */
  --ink:var(--text); --ink-2:var(--text-soft); --ink-3:color-mix(in srgb,var(--text-soft) 68%,transparent);
  --accent-ink:color-mix(in srgb,var(--accent1) 62%,var(--text));
  --hair:color-mix(in srgb,var(--accent1) 55%,transparent);
  --hair-2:color-mix(in srgb,var(--accent1) 30%,transparent);
  --hair-b:color-mix(in srgb,var(--accent2) 45%,transparent);
  --mute:color-mix(in srgb,var(--text-soft) 35%,transparent);
  --glow:color-mix(in srgb,var(--accent2) 28%,transparent);
  --page:var(--bg1);
  --bg-grad:linear-gradient(125deg,var(--bg1) 0%,var(--bg2) 17%,var(--bg3) 34%,var(--bg4) 50%,var(--bg2) 66%,var(--bg3) 83%,var(--bg1) 100%);
  --soft-bg:var(--card-bg); --soft-radius:calc(var(--card-radius) * .75);
  --soft-shadow:0 10px 30px -22px color-mix(in srgb,var(--text) 55%,transparent);
  --blur:blur(20px) saturate(1.25);
  --grad-text:linear-gradient(100deg,var(--accent1) 0%,var(--accent2) 50%,var(--accent1) 100%);
  --grad-bar:linear-gradient(90deg,var(--accent1),var(--accent2));
  --grad-deep:linear-gradient(90deg,color-mix(in srgb,var(--accent1) 82%,var(--text)),color-mix(in srgb,var(--accent2) 82%,var(--text)));
  --grad-pale:linear-gradient(90deg,color-mix(in srgb,var(--accent1) 34%,#fff),color-mix(in srgb,var(--accent2) 34%,#fff));
  --d-m:var(--accent1); --d-f:var(--accent2); --d-c:color-mix(in srgb,var(--text-soft) 55%,#fff);
  --g-m:linear-gradient(90deg,color-mix(in srgb,var(--d-m) 55%,#fff),var(--d-m));
  --g-f:linear-gradient(90deg,color-mix(in srgb,var(--d-f) 55%,#fff),var(--d-f));
  --g-c:linear-gradient(90deg,color-mix(in srgb,var(--d-c) 55%,#fff),var(--d-c));
  --track:rgba(255,255,255,.7); --ring-track:color-mix(in srgb,var(--text) 9%,transparent);
  --ring-1:var(--accent1); --ring-2:var(--accent2); --ring-3:color-mix(in srgb,var(--accent2) 80%,var(--text));
  --btn:linear-gradient(100deg,var(--accent1),var(--accent2) 55%,var(--accent1)); --btn-ink:#fff;
  --btn-ts:0 1px 2px color-mix(in srgb,var(--text) 45%,transparent);
  --btn-sh:0 14px 28px -14px color-mix(in srgb,var(--accent2) 90%,transparent);
  --on:linear-gradient(100deg,var(--accent1),var(--accent2)); --on-ink:#fff; --on-ts:var(--btn-ts);
  --field:rgba(255,255,255,.55); --field-f:rgba(255,255,255,.8);
  --c-gold-bg:color-mix(in srgb,var(--accent1) 28%,#fff); --c-gold-ink:color-mix(in srgb,var(--accent1) 45%,var(--text));
  --c-blush-bg:color-mix(in srgb,var(--accent2) 26%,#fff); --c-blush-ink:color-mix(in srgb,var(--accent2) 45%,var(--text));
  --c-rose-bg:var(--danger); --c-rose-ink:#fff;
  --c-mist-bg:color-mix(in srgb,var(--text-soft) 16%,#fff); --c-mist-ink:var(--text-soft);
  --alert-bg:color-mix(in srgb,var(--danger) 12%,#fff); --alert-ink:color-mix(in srgb,var(--danger) 80%,var(--text));
  --booked-item:var(--card-bg);
  --bar-bg:color-mix(in srgb,var(--bg1) 80%,transparent); --tabbar-bg:color-mix(in srgb,var(--bg1) 95%,transparent);
  --sheet-bg:color-mix(in srgb,var(--bg1) 90%,transparent); --scrim:rgba(50,36,26,.32);
  --latin:var(--font-display); --latin-style:normal; --num-w:500; --head-w:500; --body-w:300; --script-w:400; --script-style:italic;
  --tabbar-h:60px; --topbar-h:46px; --orn-h:18px;
  -webkit-text-size-adjust:100%
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:var(--font-body);font-weight:var(--body-w);color:var(--ink);line-height:1.7;
  background:var(--page);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
a{color:inherit}

/* theme crossfade: View Transitions where available, plain colour transitions otherwise */
::view-transition-old(root),::view-transition-new(root){animation-duration:.4s;animation-timing-function:ease}
html.theming *,html.theming *::before,html.theming *::after{transition:background-color .4s ease,color .4s ease,border-color .4s ease,box-shadow .4s ease,fill .4s ease,stroke .4s ease!important}

/* ---------- background ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg2)}
.bg::before{content:"";position:absolute;inset:-100%;will-change:transform;animation:drift 28s ease-in-out infinite;background:var(--bg-grad)}
@keyframes drift{0%,100%{transform:translate3d(24%,10%,0)}50%{transform:translate3d(-24%,-12%,0)}}
.orb{position:absolute;border-radius:50%;will-change:transform}
.orb.a{width:62vmax;height:62vmax;left:-22vmax;top:-20vmax;background:radial-gradient(circle,var(--orb1) 0%,transparent 70%);animation:float1 34s ease-in-out infinite}
.orb.b{width:54vmax;height:54vmax;right:-20vmax;top:18vh;background:radial-gradient(circle,var(--orb2) 0%,transparent 70%);animation:float2 40s ease-in-out infinite}
.orb.c{width:46vmax;height:46vmax;left:8vw;bottom:-22vmax;background:radial-gradient(circle,var(--orb3) 0%,transparent 70%);animation:float3 46s ease-in-out infinite}
.orb.d{width:34vmax;height:34vmax;right:12vw;bottom:-8vmax;background:radial-gradient(circle,var(--orb1) 0%,transparent 70%);opacity:.7;animation:float1 38s ease-in-out infinite reverse}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(9vw,7vh) scale(1.12)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1.05)}50%{transform:translate(-10vw,-8vh) scale(.92)}}
@keyframes float3{0%,100%{transform:translate(0,0)}50%{transform:translate(12vw,-10vh) scale(1.1)}}
#petals{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

/* ---------- shared pieces ---------- */
.card{position:relative;border-radius:var(--card-radius);background:var(--card-bg);border:1px solid var(--card-border);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--card-shadow)}
.card.soft{background:var(--soft-bg);border-radius:var(--soft-radius);box-shadow:var(--soft-shadow);-webkit-backdrop-filter:none;backdrop-filter:none}
.gt{padding-right:.12em;margin-right:-.12em;background:var(--grad-text);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;animation:shimmer 9s ease-in-out infinite}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.script{font-family:var(--font-script);font-weight:var(--script-w);font-style:var(--script-style);font-synthesis:none;line-height:1.2}
.latin{font-family:var(--latin);font-style:var(--latin-style);letter-spacing:.04em}
.num{font-family:var(--latin);font-weight:var(--num-w);font-variant-numeric:lining-nums tabular-nums;letter-spacing:.01em}
.chip{display:inline-flex;align-items:center;white-space:nowrap;font-size:11.5px;font-weight:500;line-height:1;padding:5px 10px;border-radius:999px;
  letter-spacing:.06em;color:var(--chip-text);background:var(--chip-bg);box-shadow:inset 0 0 0 1px var(--mute)}
html:root .chip.gold{color:var(--c-gold-ink);background:var(--c-gold-bg)}
html:root .chip.blush{color:var(--c-blush-ink);background:var(--c-blush-bg)}
html:root .chip.rose{color:var(--c-rose-ink);background:var(--c-rose-bg)}
html:root .chip.mist{color:var(--c-mist-ink);background:var(--c-mist-bg)}
.chip.gold,.chip.blush,.chip.rose,.chip.mist{box-shadow:none}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.slot:empty{display:none}
.slot svg{display:block}

/* ---------- lock screen ---------- */
#lock{position:fixed;inset:0;z-index:20;display:flex;padding:24px;padding-top:calc(24px + env(safe-area-inset-top));overflow:auto;
  transition:opacity .8s ease,visibility .8s}
#lock.gone{opacity:0;visibility:hidden;pointer-events:none}
.lock-card{width:100%;max-width:400px;margin:auto;padding:40px 28px 32px;text-align:center;animation:rise 1.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.lock-art{display:flex;justify-content:center;margin:-8px 0 6px}
.lock-art svg{max-width:210px;max-height:120px;width:auto;height:auto}
.lock-title{font-size:clamp(44px,14.5vw,60px);margin:0 0 2px;padding:0 6px}
.lock-date{font-family:var(--latin);font-size:21px;letter-spacing:.34em;margin:14px 0 4px;color:var(--ink);padding-left:.34em}
.lock-venue{font-size:12.5px;letter-spacing:.1em;color:var(--ink-2);margin:0}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;margin:22px auto;color:var(--accent1);max-width:260px;min-height:var(--orn-h)}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--accent1))}
.orn::after{background:linear-gradient(90deg,var(--accent2),transparent)}
.orn .slot{flex:none}
.orn .slot svg{height:var(--orn-h);width:auto;max-width:170px}
.field{position:relative;margin-top:6px}
.field input[type=password]{width:100%;height:52px;padding:0 20px;border:0;outline:0;border-radius:999px;text-align:center;letter-spacing:.3em;
  font-family:var(--latin);font-size:18px;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair),inset 0 2px 8px rgba(120,90,60,.08);
  transition:box-shadow .3s,background .3s}
.field input::placeholder{font-family:var(--font-body);font-size:13.5px;letter-spacing:.3em;color:var(--ink-3)}
.field input[type=password]:focus{background:var(--field-f);box-shadow:inset 0 0 0 1.5px var(--accent2),0 0 0 5px var(--glow)}
.btn-primary{width:100%;height:52px;margin-top:14px;border:0;border-radius:999px;cursor:pointer;font-weight:500;letter-spacing:.5em;padding-left:.5em;color:var(--btn-ink);font-size:15px;
  background:var(--btn);background-size:200% 100%;text-shadow:var(--btn-ts);
  box-shadow:var(--btn-sh);transition:background-position .6s,transform .2s,opacity .3s}
.btn-primary:hover{background-position:100% 0}.btn-primary:active{transform:scale(.985)}.btn-primary:disabled{opacity:.7;cursor:progress}
.remember{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-size:13px;color:var(--ink-2);cursor:pointer;letter-spacing:.1em}
.remember input{appearance:none;-webkit-appearance:none;width:17px;height:17px;border-radius:5px;margin:0;cursor:pointer;background:var(--field-f);
  box-shadow:inset 0 0 0 1px var(--accent1);display:grid;place-items:center}
.remember input:checked{background:var(--on);box-shadow:none}
.remember input:checked::after{content:"";width:9px;height:5px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:translateY(-1px) rotate(-45deg)}
.msg{min-height:22px;margin:14px 0 0;font-size:13px;color:var(--danger);letter-spacing:.08em}
.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}

/* ---------- gear ---------- */
.gear{display:grid;place-items:center;border:0;padding:0;cursor:pointer;background:none;color:var(--ink-2);-webkit-tap-highlight-color:transparent}
.gear svg{width:20px;height:20px;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.gear:active svg{transform:rotate(60deg)}
.gear.fab{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;width:42px;height:42px;border-radius:50%;z-index:21;
  background:var(--bar-bg);box-shadow:inset 0 0 0 1px var(--hair),0 8px 20px -12px color-mix(in srgb,var(--text) 60%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}

/* ---------- app shell: top bar, tab bar, pages ---------- */
#app{position:relative;z-index:2;max-width:1080px;margin:0 auto;
  padding:calc(var(--topbar-h) + env(safe-area-inset-top)) 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 96px)}
.topbar{position:fixed;left:0;right:0;top:0;z-index:12;height:calc(var(--topbar-h) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;justify-content:center;background:var(--bar-bg);
  -webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);border-bottom:1px solid var(--hair-2)}
.topbar-title{font-size:15px;font-weight:500;letter-spacing:.4em;padding-left:.4em;color:var(--ink)}
.topbar .gear{position:absolute;right:6px;bottom:1px;width:44px;height:44px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:12;display:grid;grid-template-columns:repeat(5,1fr);
  height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));padding:0 6px env(safe-area-inset-bottom);
  background:var(--tabbar-bg);-webkit-backdrop-filter:blur(20px) saturate(1.25);backdrop-filter:blur(20px) saturate(1.25);
  border-top:1px solid var(--hair-2);box-shadow:0 -10px 30px -22px color-mix(in srgb,var(--text) 60%,transparent)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-decoration:none;
  color:var(--ink-2);font-size:11px;font-weight:500;letter-spacing:.16em;-webkit-tap-highlight-color:transparent;transition:color .3s}
.tab svg{width:24px;height:24px;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.tab span{padding-left:.16em}
.tab::before{content:"";position:absolute;top:0;left:50%;width:26px;height:3px;margin-left:-13px;border-radius:0 0 4px 4px;background:var(--grad-bar);opacity:0;transform:scaleX(.3);transition:opacity .3s,transform .3s}
.tab.active{color:var(--accent-ink)}
.tab.active::before{opacity:1;transform:none}
.tab.active svg{transform:translateY(-1px) scale(1.08)}
#mascot-layer{position:fixed;left:0;right:0;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom));height:90px;z-index:11;pointer-events:none;overflow:visible}
/* soft "ground" so page text fades out under a walking mascot instead of colliding with it */
#mascot-layer.ground::before{content:"";position:absolute;left:0;right:0;bottom:0;height:104px;pointer-events:none;
  background:linear-gradient(to top,color-mix(in srgb,var(--bg2) 94%,transparent) 0%,color-mix(in srgb,var(--bg2) 80%,transparent) 45%,transparent 100%)}
.page{padding-top:8px}
.page.page-in{animation:pageIn .38s cubic-bezier(.2,.7,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.head{text-align:center;margin:18px 0 22px;position:relative}
.page-subtitle{display:block;font-size:17px;color:var(--accent-ink);opacity:.9}
.page-title{display:inline-flex;align-items:center;margin:0;font-family:var(--font-display);font-size:29px;font-weight:var(--head-w);letter-spacing:.3em;padding-left:.3em}
.heading-icon{flex:none;margin-right:.32em;margin-left:-.3em}
.heading-icon svg{height:1.05em;width:auto}
.head .orn{margin:8px auto 0;max-width:220px}
.sub{font-size:15px;font-weight:500;letter-spacing:.22em;margin:30px 4px 12px;display:flex;align-items:center;gap:10px;color:var(--ink)}
.sub::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--hair),var(--hair-b),transparent)}
.sub small{font-family:var(--latin);font-style:var(--latin-style);font-weight:400;font-size:15px;color:var(--ink-3);letter-spacing:.04em}
.panel{padding:20px 18px}
.grid{display:grid;gap:10px}
.muted{color:var(--ink-2)}.tiny{font-size:12px;color:var(--ink-2);letter-spacing:.06em}

/* overview */
#page-overview{text-align:center;padding-top:22px}
.hero-title{font-size:clamp(46px,15vw,64px);margin:0}
.hero-line{font-size:13px;letter-spacing:.14em;color:var(--ink-2);margin:10px 0 0}
.hero-line b{display:block;font-family:var(--latin);font-weight:500;font-size:19px;letter-spacing:.3em;padding-left:.3em;color:var(--ink);margin-bottom:2px}
.hero-line i{display:none;font-style:normal}
.countdown-card{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:460px;margin:26px auto 0;padding:20px 12px 16px}
.countdown-card.has-corner{margin-top:58px}
.countdown-card>div{position:relative}
.countdown-card>div+div::before{content:"";position:absolute;left:-4px;top:16%;height:68%;width:1px;background:linear-gradient(180deg,transparent,var(--hair),transparent)}
.countdown-card .num{display:block;font-size:46px;line-height:1.05}
.countdown-card>div>span:last-child{font-size:12px;letter-spacing:.4em;padding-left:.4em;color:var(--ink-2)}
.corner-slot{position:absolute;right:14px;bottom:calc(100% - 5px);pointer-events:none;line-height:0}
.corner-slot svg{height:52px;width:auto}
.count-cap{font-size:16px;margin:12px 0 0;color:var(--accent-ink)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.stat-tile{padding:16px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-decoration:none;color:inherit;
  -webkit-tap-highlight-color:transparent;transition:transform .2s}
.stat-tile:active{transform:scale(.97)}
.stat-tile .lab{font-size:12.5px;font-weight:500;letter-spacing:.14em}
.stat-tile .val{font-size:12px;color:var(--ink-2);line-height:1.4}
.stat-tile .val .num{font-size:16px;color:var(--ink)}
.stat-tile .go{font-size:11px;letter-spacing:.14em;color:var(--accent-ink);opacity:.85;margin-top:auto;padding-top:2px}
.ring{position:relative;width:78px;height:78px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:23px}
.ring .num small{font-size:.55em;margin-left:1px}
.ring circle.tr{stroke:var(--ring-track)}
.ring circle.fg{transition:stroke-dashoffset 1.6s cubic-bezier(.2,.7,.2,1)}
.bignum{height:78px;display:grid;place-items:center;font-size:52px;line-height:1}
.foot{text-align:center;padding:34px 0 0}
.foot .script{font-size:34px;margin:0 0 4px}
.foot p{margin:2px 0;font-size:14px;color:var(--ink-2)}

/* bars */
.progress-bar{height:9px;border-radius:999px;background:var(--track);box-shadow:inset 0 0 0 1px var(--hair-2);overflow:hidden;position:relative}
.progress-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--grad-bar);width:0;transition:width 1.4s cubic-bezier(.2,.7,.2,1)}
.progress-bar i.deep,.legend i.deep{background:var(--grad-deep)}
.progress-bar i.pale,.legend i.pale{background:var(--grad-pale)}
.progress-bar i.m{background:var(--g-m)}.progress-bar i.f{background:var(--g-f)}.progress-bar i.c{background:var(--g-c)}
.brow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;padding:9px 0}
.brow .progress-bar{grid-column:1/-1;margin-top:4px}

${S} .lock-date{font-size:14px;font-weight:300;letter-spacing:.5em;padding-left:.5em;margin-top:16px}
${S} .lock-venue{font-size:11.5px;letter-spacing:.22em;color:var(--ink-2)}
${S} .hero-line{font-size:11.5px;letter-spacing:.24em;margin-top:16px}

${S} .page-subtitle,${S} .count-cap,${S} .foot .latin,${S} .booked .lab,${S} .sub small,${S} .stat-tile .go{text-transform:uppercase;font-weight:400}
${S} .page-subtitle{font-size:10.5px;letter-spacing:.46em;padding-left:.46em;color:${RUST};opacity:1;margin-bottom:8px}
${S} .page-title{font-size:30px;letter-spacing:.5em;padding-left:.5em;color:${INK}}
${S} .head{margin:26px 0 30px}
${S} .head .orn{margin-top:16px}
${S} .count-cap{font-size:10px;letter-spacing:.36em;padding-left:.36em;margin-top:18px;color:var(--ink-2)}
${S} .foot .latin{font-size:10px;letter-spacing:.3em;color:var(--ink-3)}
${S} .booked .lab{font-size:11px;letter-spacing:.34em;color:${RUST}}
${S} .sub{font-size:13px;font-weight:400;letter-spacing:.34em;margin:38px 2px 14px;gap:14px}
${S} .sub::after{background:var(--hair)}
${S} .sub small{font-size:10px;letter-spacing:.24em;color:var(--ink-3)}
${S} .topbar-title{font-size:13px;font-weight:400;letter-spacing:.5em;padding-left:.5em}
${S} .stage-tag{font-size:11px;font-weight:400;letter-spacing:.3em;color:${RUST};margin-top:22px}
${S} .item .name,${S} .brow .t,${S} .grow .n,${S} .stat-tile .lab,${S} .sw-n{font-weight:400}

${S} .bignum{font-size:50px;color:${RUST}}

${S} .search-input{border-radius:6px;font-size:14px;padding:0 16px}
${S} .fchips button{border-radius:3px;font-size:12px;letter-spacing:.2em;padding:7px 13px}
${S} .fchips button.on{font-weight:400}
${S} .gear.fab{box-shadow:inset 0 0 0 1px var(--hair)}

/* bars */
${S} .topbar,${S} .tabbar{-webkit-backdrop-filter:none;backdrop-filter:none}
${S} .tabbar{box-shadow:none;border-top:1px solid var(--hair)}
${S} .tab{font-size:10.5px;font-weight:400;letter-spacing:.24em;color:#8A8178}
${S} .tab span{padding-left:.24em}
${S} .tab::before{height:2px;border-radius:0;width:22px;margin-left:-11px;background:${INK}}
${S} .tab.active{color:${INK}}
${S} .tab.active svg{transform:none}

/* settings sheet */
${S} .settings-sheet{border-radius:12px 12px 0 0;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 -1px 0 var(--hair)}
${S} .sw{border-radius:8px}
${S} .sw-pv{border-radius:4px}
${S} .sw[aria-checked="true"]{box-shadow:inset 0 0 0 1.5px ${INK}}
${S} .sw-ok{background:${INK}}
${S} .sheet-h button,${S} .sheet-f button{border-radius:6px}

@media (min-width:760px){
  ${S} .lock-card{padding:56px 46px 42px}
  ${S} .lock-title{font-size:52px}
  ${S} .hero-title{font-size:72px}
  ${S} .hero-line b{font-size:14px;letter-spacing:.4em;padding:0}
  ${S} .countdown-card .num{font-size:62px}
  ${S} .ring .num{font-size:32px}${S} .bignum{font-size:70px}
  ${S} .page-title{font-size:36px}${S} .page-subtitle{font-size:11px}
  ${S} .g5 .num{font-size:46px}
  ${S} .settings-sheet{border-radius:12px}
}

  ${S} .tabbar{border-radius:8px;box-shadow:none;border:1px solid var(--hair)}
  ${S} .tab{border-radius:5px;font-size:13px}
  ${S} .tab.active{color:#fff}
}

${S} .lock-art svg{max-width:220px;max-height:126px}
${S} .corner-slot{right:50%;transform:translateX(50%);bottom:calc(100% - 8px)}
${S} .corner-slot svg{height:34px}
${S} .countdown-card.has-corner{margin-top:48px}

/* engraved small caps */
${S} .page-subtitle{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.52em;padding-left:.52em;opacity:1;margin-bottom:4px}
${S} .count-cap{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.34em;padding-left:.34em;margin-top:16px}
${S} .booked .lab{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.36em}
${S} .sub small{font-weight:600;font-size:13px;letter-spacing:.14em}
${S} .foot .latin{font-size:12px;letter-spacing:.2em;text-transform:uppercase}
${S} .page-title{letter-spacing:.4em;padding-left:.4em}
${S} .hero-line b{font-weight:600;letter-spacing:.36em;padding-left:.36em}
${S} .sum .num{font-size:clamp(15px,4.7vw,24px);letter-spacing:0}
${S} .sum .lab,${S} .g5 .lab{letter-spacing:.3em;padding-left:.3em;font-weight:500}
${S} .stat-tile .lab{letter-spacing:.12em}
${S} .stat-tile .go{letter-spacing:.24em}
${S} .sub{letter-spacing:.3em}
${S} .sub::before{content:"";flex:none;width:6px;height:6px;margin:0 2px;transform:rotate(45deg);background:linear-gradient(135deg,#E6C877,#8A6A2F)}
${S} .sub::after{height:3px;background:linear-gradient(90deg,var(--hair),transparent) top/100% 1px no-repeat,linear-gradient(90deg,var(--hair-2),transparent 70%) bottom/100% 1px no-repeat}
${S} .stage-tag{letter-spacing:.3em}
${S} .done .name::before{content:"◆";font-size:8px;color:#B08A3C}

/* ornament rules: double hairlines */
${S} .orn{max-width:280px;gap:8px}
${S} .head .orn{max-width:250px;margin-top:10px}
${S} .orn::before{height:4px;background:linear-gradient(90deg,transparent,currentColor) top/100% 1px no-repeat,linear-gradient(90deg,transparent 35%,currentColor) bottom/100% 1px no-repeat}
${S} .orn::after{height:4px;background:linear-gradient(90deg,currentColor,transparent) top/100% 1px no-repeat,linear-gradient(90deg,currentColor,transparent 65%) bottom/100% 1px no-repeat}

/* bars + rings */
${S} .progress-bar{box-shadow:inset 0 0 0 1px rgba(168,130,47,.4),inset 0 2px 3px rgba(96,66,14,.16)}
${S} .progress-bar i{overflow:hidden;box-shadow:inset 0 0 0 .5px rgba(94,67,21,.55)}
${S} .progress-bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,252,232,.85) 50%,transparent 70%);animation:goldGlint 7.5s ease-in-out infinite}
${S} .progress-bar i.pale::after{display:none}
${S} .ring circle.fg{filter:drop-shadow(0 1px 1px rgba(80,54,10,.35))}
${S} .split{box-shadow:0 0 0 1px rgba(168,130,47,.4);padding:0}
${S} .tab::before{height:3px;border-radius:0 0 2px 2px}
${S} .tabbar{border-top:1px solid transparent;border-image:linear-gradient(90deg,#9C7A35,#F3DE9A 30%,#B08A3C 50%,#F3DE9A 70%,#9C7A35) 1;box-shadow:0 -12px 30px -20px rgba(96,66,14,.6),inset 0 1px 0 #fff}
${S} .topbar{border-bottom:1px solid transparent;border-image:linear-gradient(90deg,transparent,#B08A3C 25%,#EBD189 50%,#B08A3C 75%,transparent) 1}
${S} .topbar-title{letter-spacing:.5em;padding-left:.5em}
${S} .tab{font-weight:500}
${S} .tab svg{stroke-width:1.2}
@media (min-width:900px){${S} .tabbar{border-image:none;border:1px solid rgba(168,130,47,.55)}${S} .topbar{border-image:none;border:0}}

/* chips, buttons, fields */
${S} .chip{font-weight:500;letter-spacing:.1em;box-shadow:inset 0 0 0 1px rgba(168,130,47,.7)}
${S} .chip.gold{box-shadow:inset 0 0 0 1px rgba(110,81,32,.45),inset 0 1px 0 rgba(255,252,236,.8)}
${S} .chip.blush,${S} .chip.mist{box-shadow:inset 0 0 0 1px rgba(110,81,32,.18)}
${S} .chip.rose{box-shadow:inset 0 1px 0 rgba(255,220,215,.35)}
${S} .btn-primary{font-weight:600;letter-spacing:.62em;padding-left:.62em;background-size:220% 100%}
${S} .remember input:checked::after{border-color:#2E1F0E}
${S} .remember input{box-shadow:inset 0 0 0 1px #76561C}
${S} .fchips button.on{box-shadow:inset 0 0 0 1px rgba(110,81,32,.55),inset 0 1px 0 rgba(255,250,225,.8)}
${S} .gear.fab{box-shadow:inset 0 0 0 1px rgba(168,130,47,.75),0 8px 18px -10px rgba(96,66,14,.7)}
${S} .gear{color:#76561C}
${S} .alert{border-radius:10px}
${S} .settings-sheet{border-radius:18px 18px 0 0;box-shadow:0 -20px 50px -22px rgba(60,40,10,.6),inset 0 1px 0 #fff,inset 0 2px 0 rgba(201,162,75,.7)}
${S} .sw{border-radius:12px}
${S} .sw-pv{border-radius:8px}
${S} .gold-comet{position:absolute;left:0;bottom:0;width:100%;height:240px;pointer-events:none}

/* ---- 樂樂 the pet: one fixed full-screen layer; only the dog and his props take pointer events ---- */
.lele-layer{position:fixed;inset:0;z-index:11;pointer-events:none;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lele-layer[hidden]{display:none}
.lele-pet,.lele-prop{position:absolute;left:0;top:0;will-change:transform}
.lele-pet svg{display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
.lele-hit{position:absolute;left:29%;top:20%;width:48%;height:80%;border-radius:46%;pointer-events:auto;touch-action:none;cursor:grab;-webkit-tap-highlight-color:transparent}
.lele-hit:active{cursor:grabbing}
.lele-prop{opacity:0;transition:opacity .35s ease}
.lele-prop.on{opacity:1}
.lele-prop svg{display:block;overflow:visible}
.lele-prop.on>svg{animation:leleIn .38s cubic-bezier(.3,1.5,.5,1) both}
.lele-ball{z-index:3;padding:9px;margin:-9px;border-radius:50%}
.lele-ball.on{pointer-events:auto;touch-action:none;cursor:grab}
.lele-ball i{position:absolute;left:18%;right:18%;bottom:5px;height:5px;border-radius:50%;background:rgba(154,106,72,.22)}
.lele-bowl{z-index:2}
.lele-pet{z-index:1}
.lele-fx{position:absolute;z-index:5;pointer-events:none;line-height:0}
.lele-fx svg{display:block}
@keyframes leleIn{from{opacity:0;transform:scale(.2)}60%{opacity:1;transform:scale(1.14)}to{opacity:1;transform:none}}
@keyframes leleUp{0%{opacity:0;transform:translate(0,4px) scale(.4)}22%{opacity:1;transform:translate(calc(var(--dx,0px)*.25),-10px) scale(1.12)}100%{opacity:0;transform:translate(var(--dx,0px),-54px) scale(.9)}}
.lele-heart{animation:leleUp 1.15s ease-out forwards}
@keyframes leleZ{0%{opacity:0;transform:translate(0,0) scale(.5)}25%{opacity:.95}100%{opacity:0;transform:translate(18px,-46px) scale(1.3) rotate(12deg)}}
.lele-z{font:700 19px/1 "Quicksand","LXGW WenKai TC",sans-serif;color:#B4693A;text-shadow:0 0 3px #fff,0 0 6px #fff;animation:leleZ 2.4s ease-out forwards}
@keyframes leleCrumb{0%{opacity:1;transform:translate(0,0) scale(1)}60%{opacity:1}100%{opacity:0;transform:translate(var(--dx,0px),var(--dy,0px)) scale(.6)}}
.lele-crumb{width:4px;height:4px;border-radius:50%;background:#A7653A;animation:leleCrumb .5s cubic-bezier(.2,.6,.4,1) forwards}
.lele-crumb.w{background:#8FCBE6;border-radius:50% 50% 50% 0}
@keyframes leleSpark{0%{opacity:0;transform:scale(.2) rotate(0)}30%{opacity:1;transform:scale(1.1) rotate(40deg)}100%{opacity:0;transform:translate(var(--dx,0px),var(--dy,0px)) scale(.5) rotate(120deg)}}
.lele-spark{animation:leleSpark .8s ease-out forwards}
@keyframes lelePop{0%{opacity:0;transform:scale(.3)}16%{opacity:1;transform:scale(1.14)}28%{transform:scale(1)}78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.96) translateY(-7px)}}
.lele-bub{width:0;height:0}
.lele-bub span{position:absolute;right:-22px;bottom:4px;transform-origin:70% 100%;white-space:nowrap;line-height:1.2;
  font:700 14px/1.2 "LXGW WenKai TC","Quicksand",sans-serif;color:#A85F33;background:#FFFDF9;border:1.5px solid #E7B58C;border-radius:14px 14px 14px 4px;padding:3px 10px 4px;
  box-shadow:0 6px 14px -8px rgba(180,105,58,.6);animation:lelePop 1.25s ease-out forwards}
.lele-bub.l span{right:auto;left:-22px;border-radius:14px 14px 4px 14px;transform-origin:30% 100%}
@keyframes lelePat{0%,100%{transform:translateY(-10px) rotate(-10deg)}50%{transform:translateY(3px) rotate(4deg)}}
.lele-hand svg{animation:lelePat .44s ease-in-out infinite}
@keyframes leleLick{0%{opacity:0;transform:scale(.3)}25%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
.lele-lick{animation:leleLick 1.1s ease-out forwards}
.lele-paused *{animation-play-state:paused!important}
.lele-gl{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none}
.lele-hit3{position:absolute;left:0;top:0;width:60px;height:80px;border-radius:44%;pointer-events:auto;touch-action:none;cursor:grab;-webkit-tap-highlight-color:transparent;z-index:2}
.lele-hit3:active{cursor:grabbing}
.lele-ball3{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none;z-index:3}
.lele-ball3.on{pointer-events:auto;touch-action:none;cursor:grab}
.lele-toggle{position:absolute;left:6px;bottom:1px;width:44px;height:44px;display:grid;place-items:center;border:0;padding:0;background:none;cursor:pointer;color:#C9814F;
  -webkit-tap-highlight-color:transparent;pointer-events:auto}
.lele-toggle svg{width:22px;height:22px;transition:transform .25s cubic-bezier(.3,1.5,.5,1),opacity .25s}
.lele-toggle:active svg{transform:scale(.86)}
.lele-toggle[aria-pressed="false"] svg{opacity:.38}
.lele-toggle[aria-pressed="false"]::after{content:"";position:absolute;left:11px;right:11px;top:50%;height:2px;border-radius:2px;background:#B79A86;transform:rotate(-38deg)}
@media (min-width:900px){.lele-toggle{left:22px;top:14px;bottom:auto;border-radius:50%;background:var(--bar-bg);box-shadow:inset 0 0 0 1px var(--hair-2)}}

.qk-emote svg{display:block;width:100%;height:100%;overflow:visible}

        face(c, L.x + (L.state === 'love' ? 0 : L.dir) >= c.x ? 1 : -1);

        var o = chars[1 - lead];
        var nd = -c.dir;
        lead = 1 - lead;
        if (o.state === 'hop') o.turnTo = nd;

        face(c, nd);
        setState(c, 'idle');
        c.t = 0;
      }
    }

    function update(dt) {
      var i, c, p, v;
      var L = chars[lead];
      if (L.state === 'hop' && !L.next) {
        actTimer -= dt;

          if (roomAhead > 30) { L.next = pickAct(); actTimer = 3.2 + Math.random() * 3; }
          else actTimer = 0.4;

      for (i = 0; i < 2; i++) {
        c = chars[i];

        c.blinkIn -= dt;

          if (c.blink) { c.blink = false; c.blinkIn = 2.4 + Math.random() * 3.2; cls(c); }
          else if (c.state === 'hop' || c.state === 'idle') { c.blink = true; c.blinkIn = 0.13; cls(c); }
          else c.blinkIn = 0.6;

            var p0 = Math.max(c.phase, AIR_A), p1 = Math.min(p, AIR_B);

            c.el.style.setProperty('--qk-p', '0');

            c.phase = p;
            c.el.style.setProperty('--qk-p', p.toFixed(3));

    setState(chars[1], 'hop');

    place(chars[0]); place(chars[1]);
    win.addEventListener('resize', onResize);

    return {
      pause: function () { stop(); },
      resume: function () { start(); },

        dead = true;
        while (timers.length) win.clearTimeout(timers.pop());

        if (ownStyle && style.parentNode && !doc.querySelector('.qk-root')) style.parentNode.removeChild(style);
      }
    };
  }

  window.WeddingThemes['quokka'] = {
    id: 'quokka',
    name: 'Quokka',

      'https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap'

    css: css,
    swatch: swatch,
    ornament: ornament,
    lockArt: lockArt,
    cornerMascot: cornerMascot,
    headingIcon: headingIcon,
    particles: particles,
    runner: { mount: mountRunner }

})();

/* ---------- particle canvas engine (theme supplies spawn/step/draw) ---------- */
var particles=(function(){
  var cv=$("petals"),ctx=cv.getContext&&cv.getContext("2d"),W=0,H=0,dpr=1,P=[],def=null,raf=0,last=0;
  function size(){
    dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);if(ctx)ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function fail(e){def=null;P=[];stop();if(ctx)ctx.clearRect(0,0,W,H);if(window.console)console.warn("particles disabled:",e)}
  function init(){
    P=[];if(!def)return;
    try{if(def.init)def.init(W,H);var n=Math.max(0,Math.min(80,Math.round(def.count||0)));for(var i=0;i<n;i++)P.push(def.spawn(W,H))}catch(e){fail(e)}
  }
  function frame(t){
    raf=0;if(!def)return;
    var dt=Math.min(.05,(t-last)/1000||0);last=t;
    try{
      ctx.clearRect(0,0,W,H);
      for(var i=0;i<P.length;i++){
        var p=P[i];
        if(def.step(p,dt,W,H)===false){p=P[i]=def.spawn(W,H)}
        ctx.save();def.draw(ctx,p);ctx.restore();
      }
    }catch(e){fail(e);return}
    raf=requestAnimationFrame(frame);
  }
  function start(){if(!raf&&def&&ctx&&!document.hidden){last=performance.now();raf=requestAnimationFrame(frame)}}
  function stop(){if(raf){cancelAnimationFrame(raf);raf=0}}
  if(ctx){
    size();
    var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){var ow=W;size();if(Math.abs(W-ow)>80)init()},200)});
  }
  return{
    use:function(d){stop();def=ctx&&d&&typeof d.spawn==="function"&&typeof d.step==="function"&&typeof d.draw==="function"?d:null;
      if(ctx)ctx.clearRect(0,0,W,H);init();start()},
    pause:stop,resume:start
  };
})();

function injectTheme(t){
  if(!$("theme-css-"+t.id)){var st=document.createElement("style");st.id="theme-css-"+t.id;st.textContent=t.css||"";document.head.appendChild(st)}
  (t.fonts||[]).forEach(function(href){
    if(typeof href!=="string"||!/^https:\/\/fonts\.googleapis\.com\//.test(href))return;
    if(qsa("link[rel=stylesheet]").some(function(l){return l.getAttribute("href")===href}))return;
    var l=document.createElement("link");l.rel="stylesheet";l.href=href;document.head.appendChild(l);
  });
}
function fillSlots(root){
  var t=REG[current];if(!t)return;
  qsa("[data-slot]",root).forEach(function(s){var h=t[s.getAttribute("data-slot")];s.innerHTML=typeof h==="string"?h:""});
  $("count").classList.toggle("has-corner",!!t.cornerMascot);
}
function killRunner(){if(runner){try{runner.destroy&&runner.destroy()}catch(e){}runner=null}layer.textContent=""}
function mountRunner(){
  killRunner();
  var t=REG[current];
  if(!unlocked||!t||!t.runner||typeof t.runner.mount!=="function"||(reduce&&!t.runner.reducedMotion)){layer.hidden=true;return}
  layer.hidden=false;layer.classList.toggle("ground",t.runner.ground!==false);
  try{runner=t.runner.mount(layer)||null;if(runner&&document.hidden&&runner.pause)runner.pause()}catch(e){runner=null;if(window.console)console.warn("runner failed:",e)}
}
function markSwatches(){qsa(".sw").forEach(function(b){var on=b.getAttribute("data-id")===current;b.setAttribute("aria-checked",on?"true":"false");b.tabIndex=on?0:-1})}
function applyTheme(id){
  var t=REG[id];if(!t)return;
  current=id;injectTheme(t);html.setAttribute("data-theme",id);
  var m=$("themeColor");if(m&&t.themeColor)m.setAttribute("content",t.themeColor);
  fillSlots(document);markSwatches();
  particles.use(reduce?null:t.particles);
  mountRunner();
}
function setTheme(id){
  if(!REG[id]||id===current)return;
  lsSet(THEME_KEY,id);
  if(!reduce&&document.startViewTransition){try{document.startViewTransition(function(){applyTheme(id)});return}catch(e){}}
  html.classList.add("theming");applyTheme(id);
  setTimeout(function(){html.classList.remove("theming")},450);
}
document.addEventListener("visibilitychange",function(){
  if(document.hidden){particles.pause();if(runner&&runner.pause)try{runner.pause()}catch(e){}}
  else{particles.resume();if(runner&&runner.resume)try{runner.resume()}catch(e){}}

/* ---------- crypto ---------- */
function b64(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
function decrypt(pass){
  var subtle=window.crypto&&window.crypto.subtle;
  if(!subtle)return Promise.reject(new Error("nocrypto"));
  return subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]).then(function(base){
    return subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.salt),iterations:ENC.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  }).then(function(key){
    return subtle.decrypt({name:"AES-GCM",iv:b64(ENC.iv)},key,b64(ENC.ct));
  }).then(function(buf){return JSON.parse(new TextDecoder().decode(buf))});
}

/* ---------- lock screen ---------- */
var form=$("lockForm"),pw=$("pw"),msg=$("msg"),go=$("go"),busy=false;
function unlock(pass,auto){
  if(busy)return;busy=true;go.disabled=true;go.textContent="開啟中";msg.textContent="";
  decrypt(pass).then(function(data){
    if(auto||$("remember").checked)store.set(pass);else store.del();
    pw.value="";
    PASS=pass;DATA=data;
    render(data);
    unlocked=true;
    fillSlots(document);
    $("app").hidden=false;
    initTabs();
    $("lock").classList.add("gone");
    setTimeout(function(){$("lock").hidden=true},900);
    startReveal();
    mountRunner();
    if(API)pull(false);
  }).catch(function(err){
    busy=false;go.disabled=false;go.textContent="開啟";
    if(auto){store.del();return}
    if(err&&err.message==="nocrypto"){msg.textContent="此瀏覽器不支援解密，請改用 https 連結或較新的瀏覽器";return}
    if(err&&err.name!=="OperationError"&&window.console)console.error(err);
    msg.textContent="密碼不太對，再試一次好嗎";
    form.classList.remove("shake");void form.offsetWidth;form.classList.add("shake");
    pw.select();
  });
}
form.addEventListener("submit",function(e){e.preventDefault();if(!pw.value){pw.focus();return}unlock(pw.value,false)});
document.addEventListener("click",function(e){
  var t=e.target;if(!t||!t.closest)return;
  if(t.closest("[data-logout]")){store.del();window.location.reload();return}
  var g=t.closest("[data-settings]");if(g)openSheet(g);
});
var saved=store.get();
if(saved){$("remember").checked=true;unlock(saved,true)}

/* ---------- dom helpers (all data goes through textContent) ---------- */
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=String(text);return e}
function add(p){for(var i=1;i<arguments.length;i++){var c=arguments[i];if(c!=null)p.appendChild(typeof c==="string"?document.createTextNode(c):c)}return p}
function nf(n){return Math.round(n||0).toLocaleString("zh-TW")}
function money(n,cls){var s=el("span","num"+(cls?" "+cls:""));add(s,el("small",null,"NT$"),nf(n));return s}
function pct(a,b){return b>0?Math.max(0,Math.min(100,a/b*100)):0}
function chip(t,k){return el("span","chip"+(k?" "+k:""),t)}
function bar(p,cls){var b=el("div","progress-bar"),i=el("i",cls||"");i.dataset.w=p.toFixed(1);b.appendChild(i);return b}
function ring(p){
  var r=42,c=2*Math.PI*r,w=el("div","ring");
  w.innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="tr" cx="50" cy="50" r="'+r+'" fill="none" stroke-width="7"/>'+
    '<circle class="fg" cx="50" cy="50" r="'+r+'" fill="none" stroke="url(#gRing)" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+c.toFixed(2)+'" data-off="'+(c*(1-p/100)).toFixed(2)+'"/></svg>';
  var n=el("span","gt");add(n,String(Math.round(p)));n.appendChild(el("small",null,"%"));
  var wrap=el("span","num");wrap.appendChild(n);w.appendChild(wrap);return w;
}
function today(){var d=new Date(),p=function(n){return(n<10?"0":"")+n};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function fmtDate(s){return String(s).slice(0,10).replace(/-/g,".")}
function sum(a,f){var t=0;for(var i=0;i<a.length;i++)t+=Number(f(a[i]))||0;return t}
function groupBy(a,f){var m=[],ix={};a.forEach(function(x){var k=f(x);if(!(k in ix)){ix[k]=m.length;m.push([k,[]])}m[ix[k]][1].push(x)});return m}
function safeUrl(u){return typeof u==="string"&&/^https?:\/\//i.test(u)?u:null}
/* expandable card: summary row + optional body text */
function card(o){
  var has=o.body!=null&&(o.body.nodeType?o.body.childNodes.length>0:String(o.body).trim()!=="");

}

var SOCIAL=/(^|\.)(instagram\.com|facebook\.com|fb\.com|line\.me|lin\.ee|linktr\.ee|youtube\.com|google\.com|goo\.gl|maps\.app\.goo\.gl|threads\.net|momoshop\.com\.tw|shopee\.tw|weddingday\.com\.tw|marry\.com\.tw|verywed\.com)$/i;

/* ---------- render ---------- */
var BOXES=["tiles","stages","pending","done","bsum","meter","balert","cats","items","vbooked","vgroups","gtot","gsplit","ggroups","glist","gchips"];
function render(D){
  BOXES.forEach(function(id){var b=$(id);while(b.firstChild)b.removeChild(b.firstChild)});
  ["gq","gmore"].forEach(function(id){var o=$(id),n=o.cloneNode(true);o.parentNode.replaceChild(n,o)});

      G=(D.guests||[]).map(function(g){return Array.isArray(g)?{n:g[0],g:g[1],s:g[2],c:g[3],v:g[4]}:g});

  }

/* ---------- live sync with Notion (through the Worker) ---------- */
var PASS=null,DATA=null,LIVE=false,lastPull=0,pulling=false;
var KIND_T={tasks:"待辦",budget:"預算",vendors:"廠商",guests:"賓客"};
function api(path,body){
  return fetch(API+path,{method:body?"POST":"GET",headers:body?{"Content-Type":"application/json","X-Pass":PASS}:{"X-Pass":PASS},
    body:body?JSON.stringify(body):undefined,cache:"no-store"})
    .then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok)throw new Error(j.error||("HTTP "+r.status));return j})});
}
function syncState(k,t){var b=$("sync");b.hidden=false;b.className="sync-pill "+k;$("syncT").textContent=t}
function rerender(){
  var tab=curTab,y=window.scrollY,open=qsa("details[open]").map(function(d){var n=d.querySelector(".name");return n&&n.textContent});
  render(DATA);fillSlots(document);
  qsa("details").forEach(function(d){var n=d.querySelector(".name");if(n&&open.indexOf(n.textContent)>=0)d.open=true});
  qsa("#app .reveal").forEach(function(e){e.classList.add("in")});fill(document);
  curTab=null;showTab(tab);window.scrollTo(0,y);
}
function pull(quiet){
  if(!API||!PASS||pulling)return;pulling=true;
  if(!quiet)syncState("busy","同步中");
  api("/data").then(function(d){
    DATA=d;LIVE=true;lastPull=Date.now();html.classList.add("can-edit");
    rerender();syncState("live","已與 Notion 同步");
  }).catch(function(e){
    if(window.console)console.warn("sync failed:",e);
    syncState("off",LIVE?"同步失敗，點我重試":"離線快照・點我重試");
  }).then(function(){pulling=false});
}
$("sync").addEventListener("click",function(){pull(false)});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&LIVE&&Date.now()-lastPull>60000)pull(true)});

var toastT=0;
function toast(t,bad){var x=$("toast");x.textContent=t;x.classList.toggle("bad",!!bad);x.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){x.classList.remove("show")},2600)}

function editBtn(kind,item,name){
  var b=el("button","edit-btn");b.type="button";b.setAttribute("aria-label","編輯「"+(name||"")+"」");
  b.innerHTML='<svg aria-hidden="true"><use href="#ipen"/></svg>';
  b.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();openEdit(kind,item,b)});
  return b;
}
document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("[data-add]");if(a)openEdit(a.getAttribute("data-add"),null,a)});

/* edit sheet */
var esheet=$("esheet"),escrim=$("escrim"),eform=$("eform"),eFrom=null,eT=0,eCtx=null;
function closeEdit(){
  esheet.classList.remove("open");escrim.classList.remove("open");
  clearTimeout(eT);eT=setTimeout(function(){esheet.hidden=true;escrim.hidden=true},reduce?0:420);
  if(eFrom&&eFrom.focus&&document.contains(eFrom))try{eFrom.focus({preventScroll:true})}catch(e){}
  eCtx=null;
}
escrim.addEventListener("click",closeEdit);$("esheetX").addEventListener("click",closeEdit);
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!esheet.hidden)closeEdit()});
var PAIR={tasks:[["s","st"],["d","who"],["cat","elder"]],budget:[["e","a"],["s","who"],["cat","pd"]],vendors:[["t","s"]],guests:[["g","s"],["c","v"],["tb","amt"]]};
function field(f,val,idx){
  var w=el("label","f"),id="ef-"+f.key,inp;
  if(f.t==="checkbox"){
    w.className="chk";inp=el("input");inp.type="checkbox";inp.checked=!!val;add(w,inp,f.label);
  }else{
    w.appendChild(el("span",null,f.label));
    if(f.t==="rich_text"){inp=el("textarea");inp.rows=String(val||"").split("\n").length>3?6:3}
    else if(f.t==="status"){
      inp=el("select");(f.options||[]).forEach(function(o){var op=el("option",null,o);op.value=o;inp.appendChild(op)});
      if(val&&(f.options||[]).indexOf(val)<0){var op=el("option",null,val);op.value=val;inp.appendChild(op)}
    }
    else if(f.t==="select"){
      inp=el("input");inp.setAttribute("list",id+"-l");inp.placeholder="選擇或輸入";
      var dl=el("datalist");dl.id=id+"-l";(f.options||[]).forEach(function(o){var op=el("option");op.value=o;dl.appendChild(op)});w.appendChild(dl);
    }
    else{inp=el("input");inp.type=f.t==="number"?"number":f.t==="date"?"date":f.t==="url"?"url":"text";if(f.t==="number"){inp.inputMode="decimal";inp.step="any"}}
    if(f.t!=="status")inp.value=val==null?"":f.t==="date"?String(val).slice(0,10):String(val);
    else inp.value=val||(f.options||[])[0]||"";
    w.appendChild(inp);
    if(f.t==="rich_text"&&eCtx&&eCtx.item&&eCtx.item._rt&&eCtx.item._rt[f.key])w.appendChild(el("span","rt-warn","這欄在 Notion 有粗體或顏色，在這裡修改後會變成純文字"));
  }
  inp.id=id;inp.name=f.key;if(f.t==="title")inp.required=true;
  return w;
}
function openEdit(kind,item,from){
  if(!LIVE){toast("還沒連上 Notion，先按左上角重試",true);return}
  var sc=DATA.schema&&DATA.schema[kind];if(!sc)return;
  eCtx={kind:kind,item:item};eFrom=from||null;
  $("esheetT").textContent=(item?"編輯":"新增")+KIND_T[kind];
  while(eform.firstChild)eform.removeChild(eform.firstChild);
  var F={};sc.fields.forEach(function(f){F[f.key]=f});
  var done={},pairs=PAIR[kind]||[];
  sc.fields.forEach(function(f){
    if(done[f.key])return;
    var pr=pairs.filter(function(p){return p[0]===f.key})[0];
    if(pr&&F[pr[1]]&&!done[pr[1]]){
      var row=el("div","two-f");pr.forEach(function(k){done[k]=1;row.appendChild(field(F[k],item?item[k]:null))});eform.appendChild(row);
    }else{done[f.key]=1;eform.appendChild(field(f,item?item[f.key]:null))}
  });
  eform.appendChild(el("p","form-err"));
  var act=el("div","form-act"),save=el("button","btn btn-primary","儲存");save.type="submit";
  if(item){var del=el("button","btn-del","刪除");del.type="button";del.addEventListener("click",function(){
    if(!del.classList.contains("armed")){del.classList.add("armed");del.textContent="確定刪除？";return}
    busy(true);api("/delete",{kind:kind,id:item.id}).then(function(){
      DATA[kind]=DATA[kind].filter(function(x){return x.id!==item.id});rerender();closeEdit();toast("已刪除（Notion 垃圾桶可復原）");
    }).catch(fail);
  });act.appendChild(del)}
  act.appendChild(save);eform.appendChild(act);
  clearTimeout(eT);esheet.hidden=false;escrim.hidden=false;esheet.scrollTop=0;void esheet.offsetWidth;
  esheet.classList.add("open");escrim.classList.add("open");
  if(!item){var t=eform.querySelector("[required]");if(t)setTimeout(function(){t.focus({preventScroll:true})},420)}
  function busy(on){qsa("button,input,select,textarea",eform).forEach(function(x){x.disabled=on});save.textContent=on?"同步中…":"儲存"}
  function fail(e){busy(false);eform.querySelector(".form-err").textContent="沒有存成功："+(e&&e.message||e)}
  eform.onsubmit=function(ev){
    ev.preventDefault();
    var out={},changed=0;
    sc.fields.forEach(function(f){
      var x=eform.elements[f.key];if(!x)return;
      var v=f.t==="checkbox"?x.checked:x.value.trim();
      if(f.t==="number"&&v!=="")v=Number(v);
      var old=item?item[f.key]:undefined;
      if(f.t==="checkbox"?(!!old!==v):(String(old==null?"":f.t==="date"?String(old).slice(0,10):old)!==String(v))){out[f.key]=v;changed++}
    });
    var title=sc.fields.filter(function(f){return f.t==="title"})[0];
    if(title&&!eform.elements[title.key].value.trim()){eform.querySelector(".form-err").textContent="請填寫「"+title.label+"」";eform.elements[title.key].focus();return}
    if(!changed){closeEdit();return}
    busy(true);
    api("/save",{kind:kind,id:item?item.id:null,fields:out}).then(function(r){
      var list=DATA[kind]=DATA[kind]||[],i=item?list.map(function(x){return x.id}).indexOf(item.id):-1;
      if(i>=0)list[i]=r.item;else list.push(r.item);
      rerender();closeEdit();toast(item?"已更新到 Notion":"已新增到 Notion");
    }).catch(fail);
  };
}

/* ---------- countdown ---------- */
function startCountdown(iso){
  var target=new Date(iso).getTime();if(isNaN(target))return;
  var p=function(n){return(n<10?"0":"")+n};
  function tick(){
    var s=Math.floor((target-Date.now())/1000);
    if(s<=0){s=0;$("countCap").textContent="today, and every day after";}
    $("cd").textContent=Math.floor(s/86400);$("ch").textContent=p(Math.floor(s%86400/3600));
    $("cm").textContent=p(Math.floor(s%3600/60));$("cs").textContent=p(s%60);
  }
  tick();clearInterval(startCountdown.t);startCountdown.t=setInterval(tick,1000);
}

/* ---------- reveal on first view (per page) ---------- */
function fill(root){
  [].forEach.call(root.querySelectorAll("[data-w]"),function(i){i.style.width=i.dataset.w+"%"});
  [].forEach.call(root.querySelectorAll("[data-off]"),function(c){c.style.strokeDashoffset=c.dataset.off});
}
function startReveal(){
  var items=document.querySelectorAll("#app .reveal");
  if(reduce||!("IntersectionObserver" in window)){[].forEach.call(items,function(e){e.classList.add("in")});fill(document);return}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){
    if(e.isIntersecting){e.target.classList.add("in");var t=e.target;setTimeout(function(){fill(t)},150);io.unobserve(t)}
  })},{rootMargin:"0px 0px -4% 0px",threshold:.05});
  [].forEach.call(items,function(e){io.observe(e)});
  fill($("meter"));
}
})();
