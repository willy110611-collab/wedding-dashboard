name: 從 Notion 更新網站快照

# 網站打開時會直接透過 Worker 讀 Notion 最新資料；
# 這個排程只是定期把「離線快照」（加密後的 index.html）也更新，
# 讓沒網路或 Worker 掛掉時看到的資料不會太舊。
on:
  schedule:
    - cron: "17 */6 * * *" # 每 6 小時
  workflow_dispatch: {}     # 也可以在 Actions 頁面手動按 Run

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      WORKER_URL: ${{ secrets.WORKER_URL }}
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: 從 Worker 抓 Notion 資料
        working-directory: source
        run: |
          test -n "$WORKER_URL" && test -n "$SITE_PASSWORD" || { echo "請先在 Settings → Secrets 設定 WORKER_URL 和 SITE_PASSWORD"; exit 1; }
          curl -fsS --retry 3 -H "X-Pass: $SITE_PASSWORD" "${WORKER_URL%/}/data" -o data.json
          python3 -c "import json;d=json.load(open('data.json'));print({k:len(d.get(k,[])) for k in ('tasks','budget','vendors','guests')})"
      - name: 資料有變才重新加密打包
        working-directory: source
        run: |
          NEW=$(python3 -c "import json,hashlib;d=json.load(open('data.json'));d['meta'].pop('snapshot',None);print(hashlib.sha256(json.dumps(d,sort_keys=True,ensure_ascii=False).encode()).hexdigest())")
          OLD=$(cat .snapshot-hash 2>/dev/null || true)
          if [ "$NEW" != "$OLD" ]; then
            python3 build.py
            cp dist/index.html ../index.html
            echo "$NEW" > .snapshot-hash
          else
            echo "Notion 資料沒有變動"
          fi
          rm -f data.json
      - name: 有變動才 commit
        run: |
          git config user.name "wedding-bot"
          git config user.email "wedding-bot@users.noreply.github.com"
          git add index.html source/.snapshot-hash
          git diff --cached --quiet || git commit -m "自動更新 Notion 快照"
          git push
